spring:
  application:
    name: batch-realtime

server:
  port: 3034
  servlet:
    context-path: /
  tomcat:
    mbeanregistry:
      enabled: true
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

logging:
  level:
    p6spy: error

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    # MSA 디폴트: W3C Trace Context (traceparent). B3는 레거시 연동 시에만.
    propagation:
      type: w3c

