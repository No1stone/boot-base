spring:
  application:
    name: api-auth
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  web:
    encoding:
      force-response: true
  grpc:
    server:
      port: 9191

server:
  port: 3031
  servlet:
    context-path: /auth
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    mbeanregistry:
      enabled: true
  shutdown: graceful
  error:
    whitelabel:
      enabled: false


jasypt:
  encryptor:
    bean: jasyptEnc
    prefix: ENC(
    suffix: )

decorator:
  datasource:
    p6spy:
      enable-logging: true


# MemberController outbound 예 (MemberClientPort). 기본 off.
# origemite.member.client.enabled: true
# origemite.member.client.base-url: http://localhost:3031/auth
# origemite.rest.outbound.connect-timeout: 5s
# origemite.rest.outbound.read-timeout: 3s
# origemite.rest.outbound.logging-enabled: true

# 로그에 traceId/spanId (Micrometer Tracing → MDC)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    # MSA 디폴트: W3C Trace Context (traceparent). B3는 레거시 연동 시에만.
    propagation:
      type: w3c

