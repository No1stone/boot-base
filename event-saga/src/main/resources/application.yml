spring:
  application:
    name: event-saga
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:eventsaga;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
    consumer:
      group-id: event-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

origemite:
  message:
    saga:
      # 서버는 lib gRPC 발행 클라이언트 안 씀. 발행은 Outbox.
      publish:
        enabled: false
      # Saga 서버 = 컨슈머 (오케스트레이션)
      consume:
        enabled: true
        concurrency: 1
      orchestration:
        group: event-saga
        topics: []   # 예: [create.order, complete.payment, fail.payment]
      outbox:
        batch-size: 50
        relay-delay-ms: 2000

server:
  port: 8095

spring.grpc.server.port: 9095

logging:
  level:
    com.origemite.eventsaga: INFO
