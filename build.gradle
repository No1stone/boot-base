plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

bootJar {
    enabled = false
}
jar {
    enabled = true
}

allprojects {
    group = 'com.origemite'
    version = '0.0.1-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            // Boot 4.1.x → Cloud 2025.1.x (Oakwood). 3.5 LTS는 2025.0.x.
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.4"
            mavenBom "org.springframework.grpc:spring-grpc-dependencies:1.0.1"
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.9.1')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'

    }

    test {
        useJUnitPlatform()
        // 테스트 소스는 있으나 실행 대상 메서드가 없는 모듈(예: lib-legacy) 허용
        failOnNoDiscoveredTests = false
//        exclude '**/*'

    }
    tasks.register("prepareKotlinBuildScriptModel") { }

}
