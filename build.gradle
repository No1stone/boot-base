plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

bootJar {
    enabled = false
}
jar {
    enabled = true
}

allprojects {
    group = 'com.origemite'
    version = '0.0.1-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'

    java {
        toolchain {
            // Java4Shell CVE-2026-114938: runtime must be >= 25.0.5.1 (Corretto 25.0.5.1.2).
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        doFirst {
            def home = javaCompiler.get().metadata.installationPath.asFile
            def proc = new ProcessBuilder("${home}/bin/java", "-version")
                    .redirectErrorStream(true)
                    .start()
            def out = proc.inputStream.text
            proc.waitFor()
            def matcher = (out =~ /version \"([^\"]+)\"/)
            if (!matcher.find()) {
                throw new GradleException("Java4Shell check: cannot read java -version from ${home}")
            }
            def ver = matcher.group(1)
            def parts = ver.split('\\+')[0].split('\\.').collect { it as int }
            def major = parts.size() > 0 ? parts[0] : 0
            def minor = parts.size() > 1 ? parts[1] : 0
            def update = parts.size() > 2 ? parts[2] : 0
            def patch = parts.size() > 3 ? parts[3] : 0
            def patched = major > 25 || (major == 25 && (minor > 0 || update > 5 || (update == 5 && patch >= 1)))
            if (!patched) {
                throw new GradleException(
                        "Java4Shell (CVE-2026-114938): JDK ${ver} is not safe. Use >= 25.0.5.1 (Corretto 25.0.5.1.2). Home=${home}")
            }
        }
    }
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            // Boot 4.1.x → Cloud 2025.1.x (Oakwood). 3.5 LTS는 2025.0.x.
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.4"
            mavenBom "org.springframework.grpc:spring-grpc-dependencies:1.0.1"
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.9.1')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'

    }

    test {
        useJUnitPlatform()
        // 테스트 소스는 있으나 실행 대상 메서드가 없는 모듈(예: lib-legacy) 허용
        failOnNoDiscoveredTests = false
//        exclude '**/*'

    }
    tasks.register("prepareKotlinBuildScriptModel") { }

}
