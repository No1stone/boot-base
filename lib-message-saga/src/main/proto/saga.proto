syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.origemite.lib.message.saga.grpc";
option java_outer_classname = "SagaProto";

package saga;

// event-saga 서버가 구현. 앱은 lib 클라이언트로 Accept 호출(Outbox 적재).
service SagaIngress {
  rpc Accept (SagaRequest) returns (SagaResponse);
}

message SagaRequest {
  string type = 1; // COMPLETE | FAIL(+COMPENSATE*)
  string event_id = 2;
  string saga_id = 3;
  string domain = 4;
  string step = 5;
  string status = 6;
  string payload_json = 7;
}

message SagaResponse {
  string event_id = 1;
  string saga_id = 2;
  bool accepted = 3;
  string message = 4;
}
