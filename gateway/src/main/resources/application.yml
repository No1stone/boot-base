server:
  port: 2031

spring:
  main:
    web-application-type: reactive

# Kubernetes DNS / docker compose service name
app:
  upstream:
    api-auth: http://api-auth:3031

# 라우트는 ConfigFilter(RouteLocator). YAML spring.cloud.gateway.server.webflux.* 미사용.
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, httpexchanges, busrefresh, info, metrics, prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    # MSA 디폴트: W3C Trace Context (traceparent). B3는 레거시 연동 시에만.
    propagation:
      type: w3c

springdoc:
  swagger-ui:
    enabled: true
